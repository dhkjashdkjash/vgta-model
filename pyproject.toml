[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgta-reproducibility"
version = "0.1.0"
description = "VGTA chlorophyll-a reconstruction model"
requires-python = ">=3.8,<3.9"
authors = [
  {name = "Hongfei Hou"},
]
dependencies = [
  "numpy==1.24.4",
  "pandas==2.0.3",
  "PyYAML==6.0.1",
  "torch==2.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
